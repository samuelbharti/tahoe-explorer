# Brand configuration: the app's colors, fonts, and logo in one place.
# Consumed automatically by bslib via `bs_theme(brand = TRUE)` (see ui.R).
# Edit these values to match your brand. Spec: https://posit-dev.github.io/brand-yml/

meta:
  name: Tahoe Explorer

color:
  palette:
    teal: "#0b7285"
    blue: "#1c7ed6"
    gray: "#5b6770"
  primary: teal
  secondary: gray
  info: blue
  foreground: "#1a1a1a"
  background: "#ffffff"

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
  base:
    family: Inter
    size: 16px
  headings:
    family: Inter
    weight: 600
